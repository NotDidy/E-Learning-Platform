<h1>{{ classroom.name }}</h1>
<p>{{ classroom.description }}</p>
<p>Max students: {{ classroom.max_students }}</p>

<h2>Students</h2>
<ul>
    {% for e in students %}
    <li>{{ e.student.email }}</li>
    {% empty %}
    <li>No students yet.</li>
    {% endfor %}
</ul>

<a href="{% url 'classroom_add_student' classroom.id %}">Add Student</a>
