{% extends "base.html" %}

{% block content %}
    <h2>Available Courses</h2>
    <ul>
        {% for course in object_list %}
        <li>
            <a href="{% url 'course_detail' course.id %}">
                {{ course.title }}
            </a>
        </li>
        {% empty %}
        <li> No courses available.</li>
        {% endfor %}
    
    </ul>
{% endblock %}
