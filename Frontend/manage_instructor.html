<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Instructors - Admin Area</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        a {
            text-decoration: none;
            color: #333;
        }
        body {
            background: linear-gradient(135deg,#f6d365 0%, #fda085 100%);
            min-height: 100vh;
            color: black;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        header h1 {
            color: black;
            margin-bottom: 10px;
        }

        .admin-actions {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            flex: 0 0 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid gray;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-add {
            background-color: green;
            color: white;
        }

        .instructors-table {
            width: 100%;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-collapse: collapse;
        }

        .instructors-table th,
        .instructors-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #f1f1f1;
        }

        .instructors-table th {
            background-color: #f9f9f9;
            font-weight: bold;
        }

        .instructors-table tr:hover {
            background-color: #f9f9f9;
        }

        .action-btn {
            padding: 6px 12px;
            margin-right: 5px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 3px;
            border: none;
        }

        .edit-btn {
            background-color: blue;
            color: white;
        }

        .delete-btn {
            background-color: red;
            color: white;
        }

        .status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background-color: lightgreen;
            color: darkgreen;
        }

        .inactive {
            background-color: lightcoral;
            color: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Administrative Area</h1>
            <p>Manage instructors</p>
        </header>

        <div class="admin-actions">
            <div class="search-box">
                <input type="text" placeholder="Search instructors...">
            </div>
            <button class="btn btn-add">Add New Instructor</button>
        </div>

        <table class="instructors-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Courses</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><a href="">001</a></td>
                    <td><a href="">name</a></td>
                    <td><a href="">email</a></td>
                    <td><a href="">number of courses</a></td>
                    <td><span class="status active">Active</span></td>
                    <td>
                        <button class="action-btn edit-btn">Edit</button>
                        <button class="action-btn delete-btn">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td><a href="">002</a></td>
                    <td><a href="">name</a></td>
                    <td><a href="">email</a></td>
                    <td><a href="">number of courses</a></td>
                    <td><span class="status active">Active</span></td>
                    <td>
                        <button class="action-btn edit-btn">Edit</button>
                        <button class="action-btn delete-btn">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td><a href="">003</a></td>
                    <td><a href="">name</a></td>
                    <td><a href="">email</a></td>
                    <td><a href="">number of courses</a></td>
                    <td><span class="status inactive">Inactive</span></td>
                    <td>
                        <button class="action-btn edit-btn">Edit</button>
                        <button class="action-btn delete-btn">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td><a href="">004</a></td>
                    <td><a href="">name</a></td>
                    <td><a href="">email</a></td>
                    <td><a href="">number of courses</a></td>
                    <td><span class="status active">Active</span></td>
                    <td>
                        <button class="action-btn edit-btn">Edit</button>
                        <button class="action-btn delete-btn">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
