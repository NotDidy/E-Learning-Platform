<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor's Courses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: #333;
        }

        body {
            background: linear-gradient(135deg,#f6d365 0%, #fda085 100%);
            min-height: 100vh;
            color: black;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #333;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .instructor-info {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
        }

        .info-label {
            font-weight: bold;
            min-width: 60px;
        }

        .section-title {
            margin-bottom: 20px;
            color: #333;
        }

        .courses-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .course-card {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .course-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .course-details {
            margin-bottom: 15px;
        }

        .course-detail {
            font-size: 14px;
            margin-bottom: 5px;
            color: #666;
        }

        .course-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-active {
            background-color: lightgreen;
            color: darkgreen;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }

        .btn-view {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" class="back-link">← Back to Instructors List</a>
            <h1>Instructor's Courses</h1>
            <p>View all courses taught by this instructor</p>
        </header>

        <div class="instructor-info">
            <h2>Name (ID: number)</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Email:</span>
                    <span>email</span>
                </div>
                <br>
                <div class="info-item">
                    <span class="info-label">Status:&nbsp;&nbsp;</span>
                    <span class="status active">Active/Inactive</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Total Courses: &nbsp;&nbsp;</span>
                    <span>number</span>
                </div>
            </div>
        </div>

        <h2 class="section-title">Courses Taught</h2>
        <div class="courses-container">
            <div class="course-card">
                <h3>title</h3>
                <div class="course-details">
                    <p class="course-detail">content</p>
                </div>
                <!-- <span class="course-status status-active">Active</span> -->
                <button class="btn btn-view">View Details</button>
            </div>
            <div class="course-card">
                <h3>title</h3>
                <div class="course-details">
                    <p class="course-detail">content</p>
                </div>
                <!-- <span class="course-status status-active">Active</span> -->
                <button class="btn btn-view">View Details</button>
            </div>
            <div class="course-card">
                <h3>title</h3>
                <div class="course-details">
                    <p class="course-detail">content</p>
                </div>
                <!-- <span class="course-status status-active">Active</span> -->
                <button class="btn btn-view">View Details</button>
            </div>
            
        </div>
    </div>
</body>
</html>
