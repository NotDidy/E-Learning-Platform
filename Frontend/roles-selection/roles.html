<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content = "IE=edge">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <title>Select Roles</title>
    <link rel="stylesheet" href="styles-roles.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
      crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class = "roles-box">
    <h1 class="welcome">Welcome to Hydra Explorer!</h1>
    <h2 class="subtitle">Please select your roles to continue</h2>

    <div class="roles">
      <div class="role" onclick="selectRole('Admin')">
        <h3> <i class="fa-solid fa-user-tie"></i> Admin</h3>
      </div>
      <div class="role" onclick="selectRole('Student')">
        <h3><i class="fa-solid fa-graduation-cap"></i> Student</h3>
      </div>
      <div class="role" onclick="selectRole('Instructor')">
        <h3><i class="fa-solid fa-person-chalkboard"></i> Instructor</h3>
      </div>
    </div>
  </div>
</body>

</html>
