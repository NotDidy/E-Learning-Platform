<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel = "stylesheet" href="style-menu.css">
</head>

<script src="theme.js"></script>



<div class="theme-menu-overlay" id="themeMenu">
    <div class="theme-menu">
        <h3>Select Theme</h3>
        <div class="theme-options">
            <button class="theme-btn light" onclick="setTheme('light')">
                <i class='bx bx-sun'></i> Light
            </button>
            <button class="theme-btn dark" onclick="setTheme('dark')">
                <i class='bx bx-moon'></i> Dark
            </button>
            <button class="theme-btn blue" onclick="setTheme('blue')">
                <i class='bx bx-water'></i> Blue
            </button>
            <button class="theme-btn sepia" onclick="setTheme('sepia')">
                <i class='bx bx-book'></i> Sepia
            </button>
        </div>
        <button class="close-theme" onclick="toggleThemeMenu(event)">
            <i class='bx bx-x'></i> Close
        </button>
    </div>
</div>

<body>
    <nav class ="sidebar">
        <header>
            <div class="image-text">
                <span class="image">
                    <h2 class="logo"><i class='bx  bx-devices'  ></i></h2>
                </span>

                <div class="text header-text">
                    <span class="name">Hydra Explorer</span>
                    <span class="profession">Student Page</span>
                </div>
            </div>

            <i class='bx bx-caret-left bx-flip-horizontal'  onclick="toggleSidebar()"></i> 
        </header>

        <div class="menu-bar">
            <div class="menu">
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="#" onclick="toggleThemeMenu(event)">
                            <i class='bx bx-palette icon'></i>
                            <span class="text nav-text">Themes</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx  bx-book-content icon'  ></i>  
                            <span class="text nav-text">Courses</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx  bx-calendar-week icon'  ></i> 
                            <span class="text nav-text">Classrooms</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx  bx-user icon'  ></i>  
                            <span class="text nav-text">Students</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx  bx-book-content icon'  ></i> 
                            <span class="text nav-text">Assignments</span>
                        </a>
                    </li>
                </ul>
            </div> 
            <div class="bottom-content">
                <li class="mode">
                    <div class="moon-sun">
                        <i class='bx  bx-moon icon moon'  ></i> 
                        <i class='bx  bx-sun icon sun'  ></i> 
                    </div>
                    <span class="mode-text text"></span> 

                    <div class="toggle-switch" onclick="toggleDarkMode()">
                        <span class="switch"></span>
                    </div>
                </li>

                <li class="">
                    <a href="#">
                        <i class='bx  bx-arrow-out-left-square-half icon'  ></i> 
                        <span class="text nav-text">Logout</span>
                    </a>
                </li>
            </div>
        </div>
    </nav>

    <section class="home">
        <div id ="dashboard-main">
            <div class="white-cover">
                <h1 class="dashboard-title">Dashboard</h1>
                <p class="welcome-message">Welcome Student!</p>
                <div class="admin-badge">Student Access</div>
            </div>
        </div>
    </section>
</body>
</html>
