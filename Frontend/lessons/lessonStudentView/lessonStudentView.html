<html lang="en">

<head>
    <title>Lesson Progress</title>
    <link rel="stylesheet" href="lessonStudentView.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <div class="lesson-details-header">
        <div class="lessons-title-section">
            <div class="lessons-title">
                <div class="lesson-icon">
                    <i class='bx bx-book-open'></i>
                </div>
                Lesson Progress
            </div>
            <div class="header-actions">
                <button class="back-btn">
                    <i class='bx bx-left-arrow-alt'></i>
                    Back to Lessons
                </button>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 40%;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="lesson-details-container">
        <div class="lesson-header">
            <h1>Introduction to Python Programming</h1>
            <span class="lesson-id">Lesson ID: L001</span>
        </div>

        <p class="lesson-full-description">
            Track your progress by checking off reading materials and assignments as you complete them.
        </p>

        <div class="lesson-section">
            <h2><i class='bx bx-book-reader'></i> Reading List</h2>
            <ul class="styled-list checklist">
                <li><label><input type="checkbox"> 📘 Python Crash Course - Chapter 1</label></li>
                <li><label><input type="checkbox"> 📗 Official Python Tutorial - Sections 1–3</label></li>
                <li><label><input type="checkbox"> 📕 Think Python - Chapter 2</label></li>
            </ul>
        </div>

        <div class="lesson-section">
            <h2><i class='bx bx-clipboard'></i> Assignments</h2>
            <ul class="styled-list checklist">
                <li><label><input type="checkbox"> Basic Operations Program</label></li>
                <li><label><input type="checkbox"> Variable Practice Exercises</label></li>
                <li><label><input type="checkbox"> Mini Project: Simple Calculator</label></li>
            </ul>
        </div>

        <div class="lesson-meta">
            <div class="meta-item"><i class='bx bx-time'></i> Duration: 3 hours</div>
            <div class="meta-item"><i class='bx bx-medal'></i> Credits: 3</div>
            <div class="meta-item"><i class='bx bx-user'></i> Instructor: John Smith</div>
        </div>
    </div>
</body>

</html>
